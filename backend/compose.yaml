services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: togofood
      POSTGRES_USER: togofood
      POSTGRES_PASSWORD: togofood
    ports:
      - "5433:5432"
    volumes:
      - togofood-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togofood -d togofood"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  togofood-postgres:
